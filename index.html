<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>住院病人預計出院追蹤系統</title>
<style>
  :root{
    --bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;
    --danger:#dc2626;--warn:#d97706;--notice:#ca8a04;--ok:#16a34a;--primary:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1400px;margin:0 auto;padding:24px}
  h1{font-size:28px;margin:0 0 6px}
  .sub{color:var(--muted);margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.04)}
  .metric{font-size:30px;font-weight:700;margin-top:6px}.label{color:var(--muted);font-size:14px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
  .primary{background:var(--primary);color:#fff}.secondary{background:#eef2ff;color:#3730a3}.ghost{background:#fff;border:1px solid var(--border)}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:white}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
  th{background:#f9fafb;position:sticky;top:0;z-index:1}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}
  .danger{background:#fee2e2;color:#991b1b}.warn{background:#ffedd5;color:#9a3412}.notice{background:#fef9c3;color:#854d0e}.ok{background:#dcfce7;color:#166534}.neutral{background:#f3f4f6;color:#374151}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .section-title h2{margin:0;font-size:20px}
  .priority{margin-bottom:20px}
  .priority-list{display:grid;gap:10px}
  .priority-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--border);border-left:5px solid var(--danger);background:#fff;border-radius:12px;padding:12px}
  .priority-item.orange{border-left-color:var(--warn)}.priority-item.yellow{border-left-color:var(--notice)}
  .muted{color:var(--muted)}
  dialog{border:0;border-radius:16px;max-width:760px;width:95%;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-body{padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .full{grid-column:1/-1}.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .table-wrap{overflow:auto;max-height:520px;border:1px solid var(--border);border-radius:12px}
  .actions{display:flex;gap:6px}.small{padding:6px 9px;font-size:12px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.modal-body{grid-template-columns:1fr}}
  @media(max-width:560px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.priority-item{align-items:flex-start;flex-direction:column}}
  .tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border)}
  .tab-btn{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
</style>
</head>
<body>
<div class="wrap">
  <h1>住院病人預計出院追蹤系統</h1>
  <div class="sub">T1 完成後個案追蹤｜以 T2 日期為主要提醒，建議僅使用 Study ID，不輸入可識別資訊</div>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnTracking" onclick="switchTab('tracking')">個案追蹤</button>
    <button class="tab-btn" id="tabBtnScreening" onclick="switchTab('screening')">篩選記錄</button>
  </div>

  <div id="tabTracking">
    <div class="grid">
      <div class="card"><div class="label">目前追蹤中</div><div class="metric" id="mTracking">0</div></div>
      <div class="card"><div class="label">T2 尚未完成</div><div class="metric" id="mT2">0</div></div>
      <div class="card"><div class="label">T2 3日內到期</div><div class="metric" id="mT2Soon">0</div></div>
    </div>

    <div class="card priority">
      <div class="section-title"><h2>今日優先追蹤</h2><span class="muted">T2 已到期或 3 日內到期且尚未完成者自動置頂</span></div>
      <div id="priorityList" class="priority-list"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <h2>全部個案</h2>
        <div class="toolbar">
          <button class="primary" onclick="openAdd()">＋ 新增個案</button>
          <button class="secondary" onclick="exportData()">匯出備份</button>
          <label class="btn ghost">匯入備份<input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></label>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" placeholder="搜尋 Study ID / 病房" oninput="render()" style="max-width:240px">
        <select id="filterGroup" onchange="render()" style="max-width:160px"><option value="">全部組別</option><option>實驗組</option><option>對照組</option></select>
        <select id="filterStatus" onchange="if(this.value==='已完成研究') document.getElementById('showCompleted').checked=true; render()" style="max-width:200px"><option value="">全部狀態</option><option>追蹤中</option><option>等待T2</option><option>預計出院</option><option>已完成研究</option><option>提前出院</option><option>退出研究</option></select>
        <label class="btn ghost" style="display:flex;align-items:center;gap:8px"><input id="showCompleted" type="checkbox" onchange="render()" style="width:auto">顯示已完成（<span id="completedCount">0</span>）</label>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Study ID</th><th>組別</th><th>病房</th><th>收案日</th><th>預計出院</th><th>T2預計日</th><th>T2倒數</th><th>T2</th><th>研究狀態</th><th>操作</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tabScreening" hidden>
    <div class="grid grid-4">
      <div class="card"><div class="label">累計篩選總數</div><div class="metric" id="sTotal">0</div></div>
      <div class="card"><div class="label">累計收案</div><div class="metric" id="sTotalEnrolled">0</div></div>
      <div class="card"><div class="label">累計拒絕</div><div class="metric" id="sTotalDeclined">0</div></div>
      <div class="card"><div class="label">累計排除</div><div class="metric" id="sTotalExcluded">0</div></div>
    </div>

    <div class="card">
      <div class="section-title"><h2>每日篩選數量</h2><span class="muted">同一天再次儲存會直接更新該天的數字｜排除＝篩選－收案－拒絕，自動計算</span></div>
      <div class="toolbar">
        <label style="max-width:170px">日期<input id="screenDate" type="date"></label>
        <label style="max-width:140px">今日篩選總數<input id="screenTotalInput" type="number" min="0" placeholder="0"></label>
        <label style="max-width:140px">收案人數<input id="screenEnrolledInput" type="number" min="0" placeholder="0"></label>
        <label style="max-width:140px">拒絕人數<input id="screenDeclinedInput" type="number" min="0" placeholder="0"></label>
        <button class="primary" onclick="saveScreenDay()">儲存</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>日期</th><th>篩選總數</th><th>收案</th><th>拒絕</th><th>排除</th><th>操作</th>
          </tr></thead>
          <tbody id="screenTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<dialog id="caseDialog">
  <form method="dialog" id="caseForm" onsubmit="saveCase(event)">
    <div class="modal-head"><strong id="modalTitle">新增個案</strong><button type="button" class="ghost small" onclick="caseDialog.close()">關閉</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <label>Study ID<input id="studyId" required placeholder="例如 E001"></label>
      <label>組別<select id="group"><option>實驗組</option><option>對照組</option></select></label>
      <label>病房<input id="ward" placeholder="例如 13W"></label>
      <label>收案日期<input id="enrollDate" type="date" required></label>
      <label>預計出院日<input id="expectedDischarge" type="date"></label>
      <label>實際出院日<input id="actualDischarge" type="date"></label>
      <label>T2 預計日期（收案後 7 天）<input id="t2DueDate" type="date" readonly title="依收案日期自動計算"></label>
      <label>T2 狀態<select id="t2"><option>未完成</option><option>已完成</option></select></label>
      <label>研究狀態<select id="status"><option>追蹤中</option><option>等待T2</option><option>預計出院</option><option>已完成研究</option><option>提前出院</option><option>退出研究</option></select></label>
      <label>出院去向<select id="destination"><option value="">未填</option><option>居家</option><option>日照</option><option>機構</option><option>轉院</option><option>其他</option></select></label>
      <label class="full">備註<textarea id="note" rows="3" placeholder="例如：預計週五評估出院、待家屬安排輔具"></textarea></label>
    </div>
    <div class="modal-foot"><button type="button" class="ghost" onclick="caseDialog.close()">取消</button><button class="primary" type="submit">儲存</button></div>
  </form>
</dialog>

<script>
const KEY='discharge_tracker_cases_v1';
let cases=JSON.parse(localStorage.getItem(KEY)||'[]');
const caseDialog=document.getElementById('caseDialog');
const SKEY='discharge_tracker_screening_v1';
let screenings=JSON.parse(localStorage.getItem(SKEY)||'[]');
screenings=screenings.map(s=>'declined' in s?s:{...s,declined:0});

function switchTab(name){
  const isTracking=name==='tracking';
  document.getElementById('tabTracking').hidden=!isTracking;
  document.getElementById('tabScreening').hidden=isTracking;
  document.getElementById('tabBtnTracking').classList.toggle('active',isTracking);
  document.getElementById('tabBtnScreening').classList.toggle('active',!isTracking);
  if(!isTracking){
    if(!screenDate.value) screenDate.value=new Date().toISOString().slice(0,10);
    renderScreening();
  }
}
function saveScreenings(){localStorage.setItem(SKEY,JSON.stringify(screenings));renderScreening()}
function excludedOf(s){return s.total-s.enrolled-s.declined}
function saveScreenDay(){
  const date=screenDate.value;
  if(!date){alert('請選擇日期');return}
  const day={date,total:Number(screenTotalInput.value)||0,enrolled:Number(screenEnrolledInput.value)||0,declined:Number(screenDeclinedInput.value)||0};
  const existing=screenings.find(x=>x.date===date);
  if(existing){screenings=screenings.map(x=>x.date===date?{...x,...day}:x)}else{screenings.push({id:crypto.randomUUID(),...day})}
  saveScreenings();
  screenTotalInput.value='';screenEnrolledInput.value='';screenDeclinedInput.value='';
}
function editScreenDay(date){
  const s=screenings.find(x=>x.date===date);if(!s)return;
  screenDate.value=s.date;screenTotalInput.value=s.total;screenEnrolledInput.value=s.enrolled;screenDeclinedInput.value=s.declined;
}
function deleteScreenDay(date){if(confirm('確定刪除 '+date+' 的篩選記錄？')){screenings=screenings.filter(x=>x.date!==date);saveScreenings()}}
function renderScreening(){
  sTotal.textContent=screenings.reduce((sum,s)=>sum+s.total,0);
  sTotalEnrolled.textContent=screenings.reduce((sum,s)=>sum+s.enrolled,0);
  sTotalDeclined.textContent=screenings.reduce((sum,s)=>sum+s.declined,0);
  sTotalExcluded.textContent=screenings.reduce((sum,s)=>sum+excludedOf(s),0);

  const rows=[...screenings].sort((a,b)=>b.date.localeCompare(a.date));
  screenTbody.innerHTML=rows.map(s=>`<tr>
    <td>${esc(s.date)}</td><td>${s.total}</td><td>${s.enrolled}</td><td>${s.declined}</td><td>${excludedOf(s)}</td>
    <td><div class="actions"><button class="ghost small" onclick="editScreenDay('${s.date}')">編輯</button><button class="ghost small" onclick="deleteScreenDay('${s.date}')">刪除</button></div></td>
  </tr>`).join('')||'<tr><td colspan="6" class="muted">目前沒有篩選記錄</td></tr>';
}

function dateOnly(d){const x=new Date(d);return new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function daysUntil(s){if(!s)return null;const today=dateOnly(new Date());const target=dateOnly(s+'T00:00:00');return Math.round((target-today)/86400000)}
function t2Risk(c){
  if(c.t2==='已完成') return {text:'已完成',cls:'ok'};
  if(!c.t2DueDate) return {text:'未設定',cls:'neutral'};
  const d=daysUntil(c.t2DueDate);
  if(d<0) return {text:'逾期 '+Math.abs(d)+' 天',cls:'danger'};
  if(d===0) return {text:'今天到期',cls:'danger'};
  if(d===1) return {text:'剩 1 天',cls:'warn'};
  if(d<=3) return {text:'剩 '+d+' 天',cls:'notice'};
  return {text:'剩 '+d+' 天',cls:'ok'};
}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(cases));render()}
function openAdd(){
  document.getElementById('modalTitle').textContent='新增個案';
  document.getElementById('caseForm').reset();document.getElementById('editId').value='';
  document.getElementById('enrollDate').value=new Date().toISOString().slice(0,10);caseDialog.showModal();
}
function addDaysToDate(dateStr,days){
  if(!dateStr) return "";
  const [y,m,d]=dateStr.split('-').map(Number);
  const x=new Date(y,m-1,d);
  x.setDate(x.getDate()+days);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function syncT2DueDate(){
  t2DueDate.value=addDaysToDate(enrollDate.value,7);
}
enrollDate.addEventListener('input',syncT2DueDate);
enrollDate.addEventListener('change',syncT2DueDate);
function editCase(id){const c=cases.find(x=>x.id===id);if(!c)return;
  document.getElementById('modalTitle').textContent='編輯個案';document.getElementById('editId').value=c.id;
  ['studyId','group','ward','enrollDate','expectedDischarge','actualDischarge','t2DueDate','t2','status','destination','note'].forEach(k=>document.getElementById(k).value=c[k]||'');
  syncT2DueDate();
  caseDialog.showModal();
}
function saveCase(e){e.preventDefault();const editId=document.getElementById('editId').value;
  const c={id:editId||crypto.randomUUID(),studyId:studyId.value.trim(),group:group.value,ward:ward.value.trim(),enrollDate:enrollDate.value,expectedDischarge:expectedDischarge.value,actualDischarge:actualDischarge.value,t2DueDate:addDaysToDate(enrollDate.value,7),t2:t2.value,status:document.getElementById('status').value,destination:destination.value,note:note.value.trim()};
  if(editId){cases=cases.map(x=>x.id===editId?c:x)}else{cases.push(c)} save();caseDialog.close();
}
function deleteCase(id){if(confirm('確定刪除此個案？')){cases=cases.filter(x=>x.id!==id);save()}}
function render(){
  const q=search.value.trim().toLowerCase(),fg=filterGroup.value,fs=filterStatus.value;
  const completed=cases.filter(c=>c.status==='已完成研究');
  completedCount.textContent=completed.length;
  const showDone=document.getElementById('showCompleted').checked;
  const rows=cases.filter(c=>(showDone||c.status!=='已完成研究')&&(!q||(c.studyId||'').toLowerCase().includes(q)||(c.ward||'').toLowerCase().includes(q))&&(!fg||c.group===fg)&&(!fs||c.status===fs));
  rows.sort((a,b)=>{const da=daysUntil(a.t2DueDate),db=daysUntil(b.t2DueDate);return (da??9999)-(db??9999)});
  tbody.innerHTML=rows.map(c=>{const t2r=t2Risk(c);return `<tr>
    <td><strong>${esc(c.studyId)}</strong></td><td>${esc(c.group)}</td><td>${esc(c.ward)}</td><td>${esc(c.enrollDate)}</td><td>${esc(c.expectedDischarge||'—')}</td>
    <td>${esc(c.t2DueDate||'—')}</td><td><span class="badge ${t2r.cls}">${t2r.text}</span></td><td>${c.t2==='已完成'?'✓':'—'}</td><td>${esc(c.status)}</td>
    <td><div class="actions"><button class="ghost small" onclick="editCase('${c.id}')">編輯</button><button class="ghost small" onclick="deleteCase('${c.id}')">刪除</button></div></td>
  </tr>`}).join('')||`<tr><td colspan="10" class="muted">目前沒有符合條件的追蹤中個案</td></tr>`;

  const active=cases.filter(c=>!c.actualDischarge && c.status!=='已完成研究' && c.status!=='退出研究');
  mTracking.textContent=active.length;
  mT2.textContent=active.filter(c=>c.t2!=='已完成').length;
  mT2Soon.textContent=active.filter(c=>{const d=daysUntil(c.t2DueDate);return c.t2!=='已完成'&&d!==null&&d>=0&&d<=3}).length;

  const pri=active.filter(c=>{
    if(c.t2==='已完成') return false;
    const td=daysUntil(c.t2DueDate);
    return td!==null&&td<=3;
  }).sort((a,b)=>{
    return (daysUntil(a.t2DueDate)??9999)-(daysUntil(b.t2DueDate)??9999);
  });
  priorityList.innerHTML=pri.map(c=>{
    const td=daysUntil(c.t2DueDate), t2r=t2Risk(c);
    const cls=td<=0?'':td===1?'orange':'yellow';
    return `<div class="priority-item ${cls}"><div><strong>${esc(c.studyId)}</strong>｜${esc(c.ward||'未填病房')}<div class="muted">T2：${t2r.text}${c.t2DueDate?'（'+esc(c.t2DueDate)+'）':''}${c.note?'｜'+esc(c.note):''}</div></div><button class="primary small" onclick="editCase('${c.id}')">處理</button></div>`
  }).join('')||'<div class="muted">目前沒有需要優先追蹤的個案。</div>';
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),cases},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='discharge_tracker_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const incoming=Array.isArray(data)?data:data.cases;if(!Array.isArray(incoming))throw 0;if(confirm(`匯入 ${incoming.length} 筆資料並取代目前資料？`)){cases=incoming;save()}}catch{alert('備份檔格式錯誤')}};reader.readAsText(f);e.target.value='';}

// T2 固定為收案日後 7 天；載入舊資料時也自動校正。
let t2DatesAdjusted=false;
cases=cases.map(c=>{
  const autoT2=addDaysToDate(c.enrollDate,7);
  if(autoT2 && c.t2DueDate!==autoT2){ t2DatesAdjusted=true; return {...c,t2DueDate:autoT2}; }
  return c;
});
if(t2DatesAdjusted) localStorage.setItem(KEY,JSON.stringify(cases));

if(cases.length===0){
  const today=new Date(); const fmt=d=>d.toISOString().slice(0,10); const add=n=>{const x=new Date(today);x.setDate(x.getDate()+n);return fmt(x)};
  cases=[
    {id:crypto.randomUUID(),studyId:'E023',group:'實驗組',ward:'13W',enrollDate:add(-2),expectedDischarge:add(0),actualDischarge:'',t2DueDate:add(5),t2:'未完成',status:'預計出院',destination:'',note:'今日優先確認是否可完成 T2'},
    {id:crypto.randomUUID(),studyId:'C018',group:'對照組',ward:'12W',enrollDate:add(-1),expectedDischarge:add(1),actualDischarge:'',t2DueDate:add(6),t2:'未完成',status:'等待T2',destination:'',note:'明日可能出院'},
    {id:crypto.randomUUID(),studyId:'E025',group:'實驗組',ward:'15W',enrollDate:add(-1),expectedDischarge:add(3),actualDischarge:'',t2DueDate:add(6),t2:'未完成',status:'追蹤中',destination:'',note:'持續追蹤'}
  ]; save();
}
render();
</script>
</body>
</html>
